name: TSH to Discord

on:
  schedule:
    # Every 6 hours, at 00:08, 06:08, 12:08 and 18:08 in UTC+3 (cron is in
    # UTC), so the daily digest goes out just after midnight. GitHub may start
    # scheduled runs a few minutes late.
    - cron: "8 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      latest:
        description: "Also post the latest N opened, merged and closed PRs and releases (webhook test). 0 = normal run"
        required: false
        default: "0"
      dry_run:
        description: "Only print the messages in the run log; post nothing"
        type: boolean
        default: false

permissions:
  contents: write # commit state.json

concurrency:
  group: tsh-discord-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Post new activity to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional secret: a Google Cloud Translation API key. Without it, or
          # when Google fails, the free MyMemory service is used.
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          # Optional secret: an email raises the free MyMemory translation
          # quota from 5,000 to 50,000 characters a day.
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          # Settings (see README): translation on/off, daily digest on/off,
          # the digest's time zone in hours from UTC, and the PR types not posted.
          TRANSLATE: "1"
          DIGEST: "1"
          DIGEST_UTC_OFFSET: "3"
          SKIP_TYPES: "ci,build,test,style,refactor,chore,docs"
          LATEST: ${{ inputs.latest || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 notifier.py --latest "$LATEST" $DRY_RUN

      # Runs even when posting failed part-way, so what was posted is remembered.
      - name: Save state.json
        if: success() || failure()
        run: |
          git add state.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            echo "state.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update notifier state"
          git push || (git pull --rebase && git push)
